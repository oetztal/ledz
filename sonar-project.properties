sonar.projectKey=oetztal_ledz
sonar.organization=oetztal


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=ledz
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.exclusions=scripts/**, src/generated/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
# Generated by scripts/coverage_report.py after 'pio test -e native'.
# The Generic Coverage XML sensor is the supported path on SonarCloud 6.79+;
# `sonar.cfamily.coverage.reportPaths` is silently ignored by that build of
# the CFamily plugin, and `sonar.gcov.reportsPath=.` is deprecated.
sonar.coverageReportPaths=coverage-generic.xml
sonar.python.version=3.12
