; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<show/> +<Timer.cpp> +<color.cpp> +<strip/> +<support/> +<ShowFactory.cpp>
build_flags =
	-std=gnu++17
	--coverage
build_unflags = -std=gnu++11
; coverage_link.py must be pre: (link flags, before the program node exists);
; coverage_post.py must be post: (stale-.gcda cleanup and the `coverage`
; target, both of which need that node). Build the report with
; `pio test -e native` followed by `pio run -e native -t coverage`.
extra_scripts =
	pre:scripts/coverage_link.py
	post:scripts/coverage_post.py
lib_deps =
	bblanchon/ArduinoJson@^7.4.3

[env:adafruit_qtpy_esp32s3_nopsram]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
board_build.partitions = partitions.csv
test_ignore = *
test_filter = embedded/*
build_flags =
	-std=gnu++17
	; ArduinoJson 7 keeps the v6 spellings as deprecated shims. Fail on them so
	; the codebase cannot silently regrow StaticJsonDocument/containsKey/
	; createNested*, which is how the v6 capacity guesswork crept back in.
	-Werror=deprecated-declarations
build_unflags =
	-std=gnu++11
	; espressif32 appends its own -Wno-error=deprecated-declarations *after*
	; build_flags, and GCC takes the last one. Drop it or the -Werror above is
	; silently a no-op.
	-Wno-error=deprecated-declarations
extra_scripts =
	pre:scripts/compress_web.py
	pre:scripts/get_version.py
lib_deps =
	adafruit/Adafruit NeoPixel@^1.15.2
	arduino-libraries/NTPClient@^3.2.1
	; me-no-dev/{ESPAsyncWebServer,AsyncTCP} were transferred to the ESP32Async
	; org; the old git URLs still resolve through GitHub's redirect, which pins
	; nothing and would break the day those names are reused. Registry specs
	; instead. AsyncTCP is declared explicitly even though ESPAsyncWebServer
	; depends on it, so the version stays visible here and only one copy lands
	; in .pio/libdeps.
	; Do not pin below 3.11.0: upstream marks ESPAsyncWebServer 3.10.1 DO NOT USE.
	esp32async/ESPAsyncWebServer@^3.12.0
	esp32async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.4.3
	DNSServer
